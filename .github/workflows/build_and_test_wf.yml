name: Build docker image

# `romeprotocol/rollup-op-geth:<branch>` is published by rome-protocol/rome-rollup-clients,
# which is the authoritative builder for the op-geth + nginx runtime image (it owns the
# nginx reverse proxy, run.sh genesis init, and Solana precompile interfaces baked into
# the image). To avoid the previous race condition where both repos pushed to the same
# Docker Hub tag (last-write-wins), this workflow now only:
#   1. Dispatches the rome-rollup-clients build for the current op-geth ref.
#   2. Waits for that build to finish.
#   3. Triggers the downstream test suite.
# See: https://github.com/rome-protocol/rome-ops/issues/45

on:
  push:
  workflow_dispatch:
    inputs:
      rollup_client_ref_name:
        type: string
        description: 'rome-rollup-clients branch name to use as the build context'
        required: false
        default: 'main'

env:
  ROLLUP_CLIENT_REF_NAME: ${{ github.event.inputs.rollup_client_ref_name || 'main' }}
  OP_GETH_REF_NAME: ${{ github.ref_name }}

jobs:
  # Dependabot PRs run with a restricted secrets scope (only secrets.dependabot.*),
  # so they cannot read OP_GETH_CROSS_REPO_APP_PRIVATE_KEY. Without that the
  # cross-repo dispatch step below fails immediately, and the run-tests job
  # gated on it skips — leaving every dependabot PR with red CI and zero
  # actual verification of the bumped dependency.
  #
  # This job runs in-repo `go build` + `go vet` for dependabot PRs as a
  # proof-of-life gate. It catches the cases dependabot bumps actually break:
  # module resolution, API drift in std-lib bumps, and the blst-vs-Go-version
  # incompat (blst >= 0.3.12 fails on Go >= 1.22.1) that hits whenever a
  # transitive bump pulls a newer Go std lib. Image build + downstream
  # integration tests still happen on every non-dependabot push via
  # build-image / run-tests.
  #
  # github.actor is a GitHub-controlled identity string, not user input —
  # safe to use directly in if: conditions.
  dependabot-build:
    if: github.actor == 'dependabot[bot]'
    name: Dependabot build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pin Go 1.22.0 explicitly. setup-go with `go-version-file: go.mod`
          # honors go.mod's `toolchain go1.23.1` directive over the `go 1.22.0`
          # line, but blst v0.3.11 (the pinned crypto lib) can't compile under
          # Go >=1.22.1 — the "cannot define new methods on non-local type"
          # rule tightened. Until upstream op-geth bumps blst, every build
          # must run on exactly 1.22.0.
          go-version: '1.22.0'
      - name: go build
        env:
          # Disable Go's auto-toolchain switch so the `toolchain` directive
          # in go.mod can't pull a newer Go at build time.
          GOTOOLCHAIN: local
        run: go build ./...
      - name: go vet
        env:
          GOTOOLCHAIN: local
        run: go vet ./...

  build-image:
    if: github.actor != 'dependabot[bot]'
    name: Dispatch rome-rollup-clients image build
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OP_GETH_CROSS_REPO_APP_ID }}
          private-key: ${{ secrets.OP_GETH_CROSS_REPO_APP_PRIVATE_KEY }}
          owner: rome-protocol

      - name: Trigger rome-rollup-clients build and wait
        uses: actions/github-script@v7
        env:
          ROLLUP_CLIENT_REF_NAME: ${{ env.ROLLUP_CLIENT_REF_NAME }}
          OP_GETH_REF_NAME: ${{ env.OP_GETH_REF_NAME }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const sleep = ms => new Promise(res => setTimeout(res, ms));
            const owner = 'rome-protocol';
            const repo = 'rome-rollup-clients';
            const workflow_id = 'build_and_test_wf.yml';
            const ref = process.env.ROLLUP_CLIENT_REF_NAME;
            const op_geth_ref_name = process.env.OP_GETH_REF_NAME;
            // Pass op-geth's ref as image_tag so rome-rollup-clients publishes
            // to romeprotocol/rollup-op-geth:<op-geth ref>, preserving the
            // per-branch tag scheme that downstream consumers expect.
            // Requires rome-protocol/rome-rollup-clients#53 (image_tag input).
            const image_tag = op_geth_ref_name;

            // Snapshot existing run IDs BEFORE dispatching so we can identify
            // the run we trigger. createWorkflowDispatch does not return a run
            // ID; diffing against this snapshot uniquely IDs ours even if a
            // prior op-geth push has its own rome-rollup-clients run still in
            // flight. Same pattern used in the run-tests job below.
            const snapshot = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, per_page: 100,
            });
            const existingIds = new Set(snapshot.data.workflow_runs.map(r => r.id));

            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id, ref,
              inputs: { op_geth_ref_name, image_tag },
            });
            core.info(`Dispatched ${owner}/${repo} ${workflow_id} (ref=${ref}, op_geth_ref_name=${op_geth_ref_name}, image_tag=${image_tag})`);

            let runId = null;
            let runUrl = null;
            const discoveryAttempts = 20;
            for (let i = 0; i < discoveryAttempts; i++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, event: 'workflow_dispatch', per_page: 30,
              });
              const ours = runs.data.workflow_runs.find(r =>
                r.head_branch === ref && !existingIds.has(r.id)
              );
              if (ours) {
                runId = ours.id;
                runUrl = ours.html_url;
                core.info(`Discovered our run: ${runId} (${runUrl})`);
                break;
              }
              core.info(`Waiting for our dispatch to register... (${i + 1}/${discoveryAttempts})`);
              await sleep(15000);
            }

            if (!runId) {
              core.setFailed('Could not locate the dispatched rome-rollup-clients run.');
              return;
            }

            // Multi-arch build (amd64 + arm64) typically takes 5-10 min; allow ~30 min.
            const pollAttempts = 60;
            const delayMs = 30000;
            for (let i = 0; i < pollAttempts; i++) {
              const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
              core.info(`status=${run.status} conclusion=${run.conclusion}`);
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed(`rome-rollup-clients build did not succeed: ${run.conclusion} (${runUrl})`);
                }
                return;
              }
              await sleep(delayMs);
            }
            core.setFailed(`Timed out waiting for rome-rollup-clients build to complete (${runUrl}).`);

  run-tests:
    runs-on: ubuntu-latest
    needs: [build-image]
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OP_GETH_CROSS_REPO_APP_ID }}
          private-key: ${{ secrets.OP_GETH_CROSS_REPO_APP_PRIVATE_KEY }}
          owner: rome-protocol

      - name: Trigger tests and wait for result
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const sleep = ms => new Promise(res => setTimeout(res, ms));
            const owner = 'rome-protocol';
            const repo = 'tests';
            const workflow_id = 'reusable_wf_tests.yml';

            // Snapshot existing run IDs BEFORE dispatching so we can identify
            // the run we trigger. createWorkflowDispatch does not return a run
            // ID, and listing in-progress runs is racy when prior pushes are
            // still running (overlapping op-geth pushes can each have a tests
            // run in flight). Diffing against this snapshot uniquely IDs ours.
            const snapshot = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, per_page: 100,
            });
            const existingIds = new Set(snapshot.data.workflow_runs.map(r => r.id));

            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id,
              ref: 'master',
              inputs: {
                docker_image_tags: JSON.stringify({
                  evm: "master",
                  apps: "main",
                  relayer: "main",
                  geth: process.env.GITHUB_REF_NAME || "main",
                  tests: "latest",
                  uniswap: "latest"
                }),
                tests_list: "evm,state_comparison,state_comparison_2,uniswap_proxy,uniswap_op_geth"
              }
            });
            console.log('Dispatched. Watch: https://github.com/rome-protocol/tests/actions');

            let runId = null;
            let runUrl = null;
            const discoveryAttempts = 20;
            for (let i = 0; i < discoveryAttempts; i++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, event: 'workflow_dispatch', per_page: 30,
              });
              const ours = runs.data.workflow_runs.find(run =>
                run.head_branch === 'master' && !existingIds.has(run.id)
              );
              if (ours) {
                runId = ours.id;
                runUrl = ours.html_url;
                console.log(`Discovered our run: ${runId} (${runUrl})`);
                break;
              }
              console.log(`Waiting for our dispatch to register... (${i + 1}/${discoveryAttempts})`);
              await sleep(15000);
            }

            if (!runId) {
              core.setFailed('Could not discover the dispatched workflow run.');
              return;
            }

            // Budget covers the full integration suite (~25-30 min) plus headroom.
            const pollAttempts = 30;
            const delayMs = 90000;
            for (let i = 0; i < pollAttempts; i++) {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: runId,
              });
              console.log(`Status: ${run.status}, Conclusion: ${run.conclusion}`);
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed(`Tests failed: ${run.conclusion} (${runUrl})`);
                }
                return;
              }
              await sleep(delayMs);
            }
            core.setFailed(`Timed out waiting for tests to complete (${runUrl}).`);
